services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: txcat
      POSTGRES_PASSWORD: txcat
      POSTGRES_DB: txcat
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txcat -d txcat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
